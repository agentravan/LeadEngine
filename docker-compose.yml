services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadengine
      POSTGRES_USER: leadengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - leadengine_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadengine -d leadengine"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://leadengine:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/leadengine
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      USER_AGENT: LeadEngine/1.0 (local business research)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  leadengine_pg:
